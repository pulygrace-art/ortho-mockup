<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="放入上視、前視、左視三張圖並輸入尺寸，即時產生可旋轉、附尺寸標註的 3D 示意模型。">
<title>三視圖 3D 打樣</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{
  --ground:#E6EAE8; --panel:#F4F6F5; --ink:#172025; --muted:#5A676C; --line:#C9D1CF;
  --accent:#0F5E68; --accent-ink:#FFFFFF; --accent-soft:#D4E6E7;
  --dim:#C8442A; --stage:#DCE2DF; --grid1:#AEB9B5; --grid2:#C8D0CD; --base:#B8C1BE;
  --cell:#FFFFFF; --sheet:#EDF0EE;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --cond:"Barlow Condensed","Arial Narrow",sans-serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#101416; --panel:#161B1E; --ink:#E1E7E5; --muted:#8B979A; --line:#283235;
    --accent:#5DB8C2; --accent-ink:#0B1416; --accent-soft:#17343A;
    --dim:#FF8466; --stage:#0C1012; --grid1:#2F3A3D; --grid2:#1C2427; --base:#5E6A6C;
    --cell:#1D2428; --sheet:#121719;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#101416; --panel:#161B1E; --ink:#E1E7E5; --muted:#8B979A; --line:#283235;
  --accent:#5DB8C2; --accent-ink:#0B1416; --accent-soft:#17343A;
  --dim:#FF8466; --stage:#0C1012; --grid1:#2F3A3D; --grid2:#1C2427; --base:#5E6A6C;
  --cell:#1D2428; --sheet:#121719;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5}
*{box-sizing:border-box}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:minmax(300px,380px) 1fr;height:100%}
aside{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:20px 22px 28px;display:flex;flex-direction:column;gap:24px}
main{position:relative;min-height:0;background:var(--stage);overflow:hidden}

.brand{display:flex;flex-direction:column;gap:2px}
.brand h1{margin:0;font-size:20px;font-weight:700;letter-spacing:.02em;text-wrap:balance}
.brand p{margin:0;color:var(--muted);font-size:13px}

section{display:flex;flex-direction:column;gap:10px}
h2{margin:0;font-family:var(--cond);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:baseline}
h2 span{font-family:var(--sans);letter-spacing:.02em;text-transform:none;font-weight:500}

/* third-angle drawing sheet */
.sheet{display:grid;gap:8px;padding:8px;background:var(--sheet);border:1px solid var(--line);border-radius:4px;width:100%;max-width:100%}
.cell{position:relative;min-width:0;min-height:0;background:var(--cell);border:1px dashed var(--line);border-radius:3px;overflow:hidden}
.cell.has{border-style:solid}
.cell.over{border-color:var(--accent);border-style:solid;background:var(--accent-soft)}
.cell label{position:absolute;inset:0;cursor:pointer;display:block}
.cell canvas{position:absolute;inset:0;width:100%;height:100%}
.cell .empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:4px;font-size:11px;color:var(--muted);line-height:1.3}
.cell.has .empty{display:none}
.tag{position:absolute;left:4px;top:3px;font-family:var(--cond);font-weight:700;font-size:11px;letter-spacing:.1em;color:var(--accent);pointer-events:none}
.rm{position:absolute;right:3px;top:3px;border:0;background:var(--panel);color:var(--muted);font-size:11px;line-height:1;padding:3px 5px;border-radius:3px;cursor:pointer}
.rm:hover{color:var(--dim)}
.cell:not(.has) .rm{display:none}
.legend{display:flex;flex-direction:column;justify-content:flex-end;padding:2px 2px;font-size:10.5px;line-height:1.35;color:var(--muted);min-width:0;overflow:hidden}
.legend b{font-family:var(--cond);font-size:11px;letter-spacing:.1em;color:var(--ink);font-weight:600}
.hint{margin:0;font-size:12px;color:var(--muted)}

.dims{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dims label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.dims label b{font-family:var(--cond);color:var(--dim);letter-spacing:.08em;font-size:13px}
.dims input{width:100%;min-width:0;padding:7px 8px;border:1px solid var(--line);border-radius:3px;background:var(--cell);font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums}
.linkbtn{align-self:flex-start;border:0;background:none;padding:0;color:var(--accent);font-size:12.5px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{padding:8px 10px;cursor:pointer;display:flex;flex-direction:column;gap:1px;font-weight:500;font-size:13.5px}
.seg label small{font-weight:400;font-size:11.5px;color:var(--muted);line-height:1.35}
.seg label+input+label{border-left:1px solid var(--line)}
.seg input:checked+label{background:var(--accent);color:var(--accent-ink)}
.seg input:checked+label small{color:inherit;opacity:.8}
.seg input:focus-visible+label{outline:2px solid var(--accent);outline-offset:-3px}

.field{display:flex;flex-direction:column;gap:4px}
.field label{display:flex;justify-content:space-between;font-size:13px}
.field output{font-family:var(--mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.field input[type=range]{width:100%;accent-color:var(--accent)}
.field[aria-disabled="true"]{opacity:.45}
.checks{display:flex;flex-direction:column;gap:6px;font-size:13px}
.checks label{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.checks input{accent-color:var(--accent);margin-top:3px}
.checks small{color:var(--muted);display:block;font-size:11.5px}

.samples{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--cell);border-radius:3px;padding:6px 12px;cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.status{min-height:1.5em;margin:0;font-size:12px;color:var(--muted)}
.status.err{color:var(--dim)}

.seg.seg3{grid-template-columns:repeat(3,1fr)}
.seg.plain label{align-items:center;text-align:center;padding:7px 6px}
.carton{display:flex;flex-direction:column;gap:10px}
.bgrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bgrow input[type=color]{width:38px;height:30px;padding:0 2px;border:1px solid var(--line);border-radius:3px;background:var(--cell);cursor:pointer}
.sw{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:2px}
.bgname{font-size:12px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.bgthumb{width:64px;height:40px;border-radius:3px;border:1px solid var(--line);background:var(--cell) center/cover no-repeat}

/* stage */
main{--s-ink:var(--ink);--s-muted:var(--muted);--s-chip:var(--stage);--s-dim:var(--dim)}
main[data-tone="light"]{--s-ink:#172025;--s-muted:#48555A;--s-chip:rgba(255,255,255,.8);--s-dim:#B83A22}
main[data-tone="dark"]{--s-ink:#EEF2F1;--s-muted:#B7C1C4;--s-chip:rgba(12,16,18,.72);--s-dim:#FF8C70}
#gl,#under{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#under{pointer-events:none}
.labels{position:absolute;inset:0;pointer-events:none}
.dimlabel{position:absolute;left:0;top:0;font-family:var(--mono);font-size:12px;font-weight:500;color:var(--s-dim);background:var(--s-chip);padding:1px 5px;border-radius:2px;white-space:nowrap;font-variant-numeric:tabular-nums}
.hud{position:absolute;left:16px;top:14px;font-family:var(--mono);font-size:11.5px;color:var(--s-muted);line-height:1.6;pointer-events:none;font-variant-numeric:tabular-nums}
.hud b{color:var(--s-ink);font-weight:500}
.views{position:absolute;right:16px;top:12px;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100% - 32px)}
.views button{border:1px solid var(--line);background:var(--panel);border-radius:3px;padding:4px 10px;font-size:12.5px;cursor:pointer}
.views button:hover{border-color:var(--accent);color:var(--accent)}
.views button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.foot{position:absolute;left:16px;bottom:12px;font-size:11.5px;color:var(--s-muted);pointer-events:none}
.drop-all{position:absolute;inset:12px;border:2px dashed var(--accent);border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--accent);font-weight:500;background:color-mix(in srgb,var(--stage) 80%,transparent);pointer-events:none}

@media (max-width:820px){
  .app{grid-template-columns:1fr;height:auto}
  main{order:-1;height:62svh;min-height:340px}
  aside{border-right:0;border-top:1px solid var(--line);padding-inline:16px}
  .hud{top:auto;bottom:34px;right:16px}
}

.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 45%,rgba(0,0,0,.32) 100%)}
.views .primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:500}
.views .primary:hover{color:var(--accent-ink);filter:brightness(1.08)}
.views .primary[aria-pressed="true"]{filter:brightness(.9)}
.views button:disabled{opacity:.6;cursor:progress}
.hqbar{position:absolute;right:16px;bottom:12px;width:min(320px,calc(100% - 32px));background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.hqtext{display:flex;justify-content:space-between;gap:8px;font-variant-numeric:tabular-nums}
.hqtext span{font-family:var(--mono);color:var(--muted);font-size:12px}
.hqtrack{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.hqfill{height:100%;width:0;background:var(--accent);transition:width .2s}
.hqbtns{display:flex;justify-content:flex-end;gap:6px}
.hqbtns .btn{padding:3px 10px;font-size:12px}
</style>

</head>
<body>
<div class="app">
  <aside>
    <div class="brand">
      <h1>三視圖 3D 打樣</h1>
      <p>放入上視、前視、左視三張圖並填入尺寸，右側即時產生 3D 示意模型；按「高品質渲染」可算出接近商品照的光影。</p>
    </div>

    <section>
      <h2>視圖 <span>第三角法排列</span></h2>
      <div class="sheet" id="sheet">
        <div class="legend" style="grid-area:lg">
          <b>THIRD ANGLE</b>
          左視圖：左＝背面、右＝正面<br>上視圖：下＝正面
        </div>
        <div class="cell" id="cell-top" data-view="top" style="grid-area:top">
          <label for="file-top"><canvas></canvas><span class="empty">上視圖<br>拖放或點擊</span></label>
          <input type="file" id="file-top" accept="image/*" hidden>
          <span class="tag">TOP · W×D</span><button class="rm" type="button" aria-label="移除上視圖">移除</button>
        </div>
        <div class="cell" id="cell-left" data-view="left" style="grid-area:left">
          <label for="file-left"><canvas></canvas><span class="empty">左視圖<br>拖放或點擊</span></label>
          <input type="file" id="file-left" accept="image/*" hidden>
          <span class="tag">LEFT · D×H</span><button class="rm" type="button" aria-label="移除左視圖">移除</button>
        </div>
        <div class="cell" id="cell-front" data-view="front" style="grid-area:front">
          <label for="file-front"><canvas></canvas><span class="empty">前視圖<br>拖放或點擊</span></label>
          <input type="file" id="file-front" accept="image/*" hidden>
          <span class="tag">FRONT · W×H</span><button class="rm" type="button" aria-label="移除前視圖">移除</button>
        </div>
      </div>
      <p class="hint">紅色區域為自動去除的背景；滿版的印刷圖會整張使用。也可以把三張圖一次拖到右側畫面，檔名含 top／front／left（或 上／前／左）即自動對位。</p>
    </section>

    <section>
      <h2>尺寸 <span>mm</span></h2>
      <div class="dims">
        <label for="dim-w"><span><b>W</b> 寬</span><input id="dim-w" type="number" min="1" step="1" inputmode="decimal"></label>
        <label for="dim-d"><span><b>D</b> 深</span><input id="dim-d" type="number" min="1" step="1" inputmode="decimal"></label>
        <label for="dim-h"><span><b>H</b> 高</span><input id="dim-h" type="number" min="1" step="1" inputmode="decimal"></label>
      </div>
      <button class="linkbtn" id="infer" type="button">以 W 為準，依圖片比例推算 D、H</button>
    </section>

    <section>
      <h2>生成方式</h2>
      <div class="seg" role="radiogroup" aria-label="生成方式">
        <input type="radio" name="mode" id="mode-hull" value="hull">
        <label for="mode-hull">輪廓雕刻<small>依三視圖外形切出實體</small></label>
        <input type="radio" name="mode" id="mode-box" value="box" checked>
        <label for="mode-box">紙箱模擬<small>微圓角邊緣、六面貼圖</small></label>
      </div>
      <div class="field" id="f-radius" hidden>
        <label for="radius">紙箱邊緣圓角 <output id="radius-out"></output></label>
        <input type="range" id="radius" min="0" max="12" step="0.5">
      </div>
      <div class="carton" id="f-carton" hidden>
        <div class="checks">
          <label for="chk-seam"><input type="checkbox" id="chk-seam"><span>頂部封箱摺線<small>上下兩片主摺頁在中線對接的縫</small></span></label>
          <label for="chk-flute"><input type="checkbox" id="chk-flute"><span>瓦楞紙紋理<small>表面楞紋，封箱縫內可見波浪斷面</small></span></label>
          <label for="chk-bulge"><input type="checkbox" id="chk-bulge"><span>箱面微鼓<small>裝滿內容物時箱面自然外凸</small></span></label>
        </div>
        <div class="seg seg3 plain" role="radiogroup" aria-label="封箱膠帶">
          <input type="radio" name="tape" id="tape-none" value="0">
          <label for="tape-none">無膠帶</label>
          <input type="radio" name="tape" id="tape-kraft" value="1">
          <label for="tape-kraft">牛皮膠帶</label>
          <input type="radio" name="tape" id="tape-clear" value="2" checked>
          <label for="tape-clear">透明膠帶</label>
        </div>
      </div>
      <div class="field" id="f-res">
        <label for="res">雕刻解析度 <output id="res-out"></output></label>
        <input type="range" id="res" min="24" max="140" step="4">
      </div>
      <div class="field">
        <label for="tol">背景去除容差 <output id="tol-out"></output></label>
        <input type="range" id="tol" min="4" max="160" step="2">
      </div>
      <div class="checks">
        <label for="chk-smooth" id="l-smooth"><input type="checkbox" id="chk-smooth"><span>平滑表面<small>減少雕刻鋸齒</small></span></label>
        <label for="chk-crop"><input type="checkbox" id="chk-crop"><span>自動裁切至物件外框<small>圖片留白不計入尺寸</small></span></label>
        <label for="chk-mirror"><input type="checkbox" id="chk-mirror"><span>背面、右側、底面沿用對應圖案<small>關閉則顯示素色</small></span></label>
      </div>
    </section>

    <section>
      <h2>打光</h2>
      <div class="seg seg3" role="radiogroup" aria-label="打光預設">
        <input type="radio" name="light" id="light-studio" value="studio" checked>
        <label for="light-studio">商品攝影棚<small>頂部柔光箱</small></label>
        <input type="radio" name="light" id="light-daylight" value="daylight">
        <label for="light-daylight">自然日光<small>天空光＋陽光</small></label>
        <input type="radio" name="light" id="light-flat" value="flat">
        <label for="light-flat">平光<small>均勻、看清貼圖</small></label>
      </div>
      <div class="field">
        <label for="az">主光方位 <output id="az-out"></output></label>
        <input type="range" id="az" min="-180" max="180" step="1">
      </div>
      <div class="field">
        <label for="el">主光高度 <output id="el-out"></output></label>
        <input type="range" id="el" min="8" max="88" step="1">
      </div>
      <div class="field">
        <label for="exp">曝光 <output id="exp-out"></output></label>
        <input type="range" id="exp" min="0.4" max="2.4" step="0.05">
      </div>
      <div class="field">
        <label for="gloss">表面光澤 <output id="gloss-out"></output></label>
        <input type="range" id="gloss" min="0" max="100" step="1">
      </div>
      <div class="checks">
        <label for="chk-shadow"><input type="checkbox" id="chk-shadow"><span>地面陰影<small>貼地的柔和接觸陰影與投影</small></span></label>
      </div>
    </section>

    <section>
      <h2>背景</h2>
      <div class="seg seg3 plain" role="radiogroup" aria-label="背景">
        <input type="radio" name="bg" id="bg-studio" value="studio" checked>
        <label for="bg-studio">單色攝影棚</label>
        <input type="radio" name="bg" id="bg-image" value="image">
        <label for="bg-image">圖片</label>
        <input type="radio" name="bg" id="bg-theme" value="theme">
        <label for="bg-theme">跟隨主題</label>
      </div>
      <div class="bgrow" id="bg-color-row">
        <input type="color" id="bg-picker" aria-label="自訂背景色">
        <button class="sw" type="button" data-color="#B9BBBC" style="background:#B9BBBC" aria-label="攝影棚灰"></button>
        <button class="sw" type="button" data-color="#F3F1ED" style="background:#F3F1ED" aria-label="暖白"></button>
        <button class="sw" type="button" data-color="#E6D6BF" style="background:#E6D6BF" aria-label="沙色"></button>
        <button class="sw" type="button" data-color="#C3D4C9" style="background:#C3D4C9" aria-label="鼠尾草綠"></button>
        <button class="sw" type="button" data-color="#3A3F44" style="background:#3A3F44" aria-label="炭灰"></button>
        <button class="sw" type="button" data-color="#141618" style="background:#141618" aria-label="黑"></button>
      </div>
      <div class="bgrow" id="bg-image-row" hidden>
        <span class="bgthumb" id="bg-thumb"></span>
        <label class="btn" for="bg-file">選擇背景圖片</label>
        <input type="file" id="bg-file" accept="image/*" hidden>
        <span class="bgname" id="bg-name">尚未選擇圖片</span>
      </div>
      <div class="checks">
        <label for="chk-vig" id="l-vig"><input type="checkbox" id="chk-vig"><span>暗角<small>四周微暗，聚焦商品</small></span></label>
        <label for="chk-grid"><input type="checkbox" id="chk-grid"><span>顯示地面格線</span></label>
        <label for="chk-dims"><input type="checkbox" id="chk-dims"><span>顯示尺寸標註</span></label>
      </div>
    </section>

    <section>
      <h2>範例</h2>
      <div class="samples">
        <button class="btn" type="button" data-sample="chili">鵝油辣椒紙箱</button>
        <button class="btn" type="button" data-sample="birdhouse">木製鳥屋</button>
        <button class="btn" type="button" data-sample="speaker">圓柱音箱</button>
        <button class="btn" type="button" data-sample="clear">清空</button>
      </div>
      <p class="status" id="status" aria-live="polite"></p>
    </section>
  </aside>

  <main id="stage">
    <canvas id="under" hidden></canvas>
    <canvas id="gl" aria-label="3D 示意模型，可拖曳旋轉"></canvas>

    refreshCells(); VIEWS.forEach(drawCell); scheduleBuild(); status('已清空三個視圖，放入你的圖片開始。'); return;
  }
  const s = SAMPLES[name];
  [state.w, state.d, state.h] = s.dims;
  syncDims();
  const m = $('#mode-' + (s.mode || 'hull'));
  if (!m.checked) { m.checked = true; m.dispatchEvent(new Event('change')); }
  const done = () => { build(); setView('product'); status(`範例：${s.label}（${s.dims[0]} × ${s.dims[1]} × ${s.dims[2]} mm）`); };
  if (!s.files) { VIEWS.forEach(k => setViewImage(k, s[k](), `sample-${k}`)); done(); return; }
  Promise.all(VIEWS.map(k => new Promise((ok, fail) => {
    const img = new Image();
    img.onload = () => ok([k, img]); img.onerror = () => fail(k);
    img.src = `assets/${k}.jpg?v=2`;
  }))).then(list => { list.forEach(([k, img]) => setViewImage(k, img, `${k}.jpg`, true)); done(); })
    .catch(k => status(`無法載入範例圖片 assets/${k}.jpg。`, true));
}
document.querySelectorAll('[data-sample]').forEach(b => b.addEventListener('click', () => loadSample(b.dataset.sample)));


/* ---------- boot ---------- */
resize();
document.querySelector('input[name=mode]:checked').dispatchEvent(new Event('change'));
loadSample('chili');
</script>
</body>
</html>
